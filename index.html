<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>RocketX</title>
  <link rel="stylesheet" href="style.css?v=visual_2">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="game-container">
    <!-- Полосы гиперскорости -->
    <div id="speedLines" class="speed-lines"></div>

    <!-- Экран 1: Полет -->
    <div id="screen-flight" class="screen active">
      <div class="stats-card">
        <p class="stats-label">ПРОЙДЕННАЯ ДИСТАНЦИЯ</p>
        <h1 id="score">0 км</h1>
        <div class="speed-badge">Скорость: <span id="speed">10</span> км/с</div>
      </div>

      <div class="space-view">
        <div class="rocket" id="rocket"></div>
      </div>

      <div class="controls">
        <button id="boostBtn" class="boost-btn" onclick="activateBoost()">ФОРСАЖ (x3)</button>
      </div>
    </div>

    <!-- Экран 2: Прокачка -->
    <div id="screen-upgrade" class="screen">
      <div class="screen-title">АНГАР МОДЕРНИЗАЦИИ</div>
      
      <div class="upgrade-card">
        <div class="upgrade-info">
          <h3>Двигатель "Вулкан"</h3>
          <p>+10 км/с к базовой скорости</p>
        </div>
        <button id="btn-engine" class="upgrade-btn" onclick="buyEngine()">100 км</button>
      </div>

      <div class="upgrade-card">
        <div class="upgrade-info">
          <h3>Охлаждение форсажа</h3>
          <p>-0.5с к откату ускорения</p>
        </div>
        <button id="btn-cooldown" class="upgrade-btn" onclick="buyCooldown()">250 км</button>
      </div>
    </div>

    <!-- Экран 3: Друзья -->
    <div id="screen-friends" class="screen">
      <div class="screen-title">ЭКИПАЖ</div>
      <p class="friends-desc">Приглашай друзей и получай 10% от всей дистанции, которую они пролетят!</p>
      
      <button class="boost-btn share-btn" onclick="shareRefLink()">ПРИГЛАСИТЬ ДРУГА</button>
    </div>

    <!-- Нижнее меню переключения -->
    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('screen-flight', this)">
        <span>🚀</span> Полет
      </button>
      <button class="nav-btn" onclick="switchTab('screen-upgrade', this)">
        <span>⚙️</span> Прокачка
      </button>
      <button class="nav-btn" onclick="switchTab('screen-friends', this)">
        <span>👥</span> Друзья
      </button>
    </nav>
  </div>

  <script src="main.js?v=visual_2"></script>
</body>
</html>
